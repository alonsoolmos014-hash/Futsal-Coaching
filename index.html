<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futsal Coach Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--pn:#121a2b;--pn2:#1c2740;--tx:#e8eefc;--mu:#8b9bb8;--ac:#4f8cff;--ok:#4ade80;--er:#fb7185;--ct:#14305a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:700;margin:0 0 .5rem;letter-spacing:.01em}
h1{font-size:2rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
.app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--pn);border-top:1px solid var(--pn2);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav a{flex:1;text-align:center;padding:.8rem 0;color:var(--mu);text-decoration:none;font-weight:600}
nav a.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
nav b{display:none}
main{flex:1;padding:1rem 1rem 6rem;max-width:980px;margin:0 auto;width:100%}
@media(min-width:800px){nav{top:0;bottom:auto;right:auto;width:190px;flex-direction:column;border:0;border-right:1px solid var(--pn2);padding-top:1.2rem}nav a{text-align:left;padding:.8rem 1.2rem;box-shadow:none!important}nav a.on{border-left:3px solid var(--ac)}nav b{display:block;font:700 1.5rem 'Barlow Condensed',sans-serif;padding:0 1.2rem 1rem;color:var(--ac)}main{margin-left:190px;padding-bottom:2rem}}
.card{background:var(--pn);border:1px solid var(--pn2);border-radius:10px;padding:1rem;margin-bottom:.8rem}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.btn{background:var(--ac);color:#1b1e23;border:0;border-radius:8px;padding:.6rem 1rem;font:600 .95rem Barlow,sans-serif;cursor:pointer}
.btn.s{background:var(--pn2);color:var(--tx)}.btn.d{background:none;color:var(--er);border:1px solid var(--er)}.btn.sm{padding:.35rem .6rem;font-size:.85rem}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--pn2);border-radius:8px;padding:.55rem;font:inherit}
label{display:block;font-size:.85rem;color:var(--mu);margin:.6rem 0 .2rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>.btn{flex:none}
.tag{display:inline-block;background:var(--pn2);border-radius:20px;padding:.1rem .6rem;font-size:.78rem;color:var(--mu);margin:0 .3rem .3rem 0}
.tag.ac{background:var(--ac);color:#1b1e23}.mu{color:var(--mu)}.er{color:var(--er)}.ok{color:var(--ok)}
.ct{width:100%;height:auto;display:block;border-radius:8px;background:var(--ct);touch-action:manipulation}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--pn2);margin:.4rem 0}
a.l{color:var(--ac);cursor:pointer;text-decoration:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5rem;background:var(--tx);color:#111;padding:.6rem 1rem;border-radius:8px;z-index:9}
.samp{border-left:3px solid var(--ac)}
#pr{display:none}
@media print{.app,.toast{display:none}#pr{display:block;background:#fff;color:#000;padding:0}#pr *{color:#000}#pr svg{max-width:360px}#pr .it{page-break-inside:avoid;border-top:1px solid #999;padding:.5rem 0}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--ac)}}
body{background:radial-gradient(900px 420px at 85% -10%,rgba(79,140,255,.14),transparent),var(--bg);font-family:Inter,system-ui,sans-serif}
.btn{font-family:Inter,system-ui,sans-serif}
h1,h2,h3,nav b{font-family:Inter,system-ui,sans-serif;letter-spacing:-.02em}
h1{font-size:1.75rem;font-weight:700;margin-bottom:.9rem}h2{font-size:.8rem;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}h3{font-size:1rem;font-weight:600}
.card{border-radius:16px;border:1px solid rgba(255,255,255,.06);padding:1.1rem}
.card:hover{border-color:rgba(79,140,255,.45)}
.btn{background:var(--ac);color:#fff;border-radius:10px}.btn.s{background:var(--pn2);color:var(--tx)}.btn.d{background:none;color:var(--er)}
.tag{background:rgba(79,140,255,.12);color:#9db8ee;border-radius:8px}.tag.ac{background:var(--ac);color:#fff}
nav{background:rgba(18,26,43,.92);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.06)}
input,select,textarea{border-radius:10px;background:#0e1626;border:1px solid rgba(255,255,255,.08)}
.ct{border-radius:12px;background:var(--ct)}.bar{height:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal b{text-align:center;color:var(--mu);font-size:.75rem}.day{background:var(--pn);border:1px solid rgba(255,255,255,.06);border-radius:10px;color:var(--tx);min-height:52px;padding:.3rem;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2rem}.day.today{border-color:var(--ac)}.day.sel{background:var(--pn2)}.day span{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}.day i{width:7px;height:7px;border-radius:50%;background:var(--ac)}.day i.m{background:#f59e0b}
@media(max-width:799px){nav a{font-size:.68rem;padding:.8rem 0}}
@media(min-width:800px){nav b{font-size:1.1rem;font-weight:700;letter-spacing:.08em}nav a{margin:0 .6rem;padding:.65rem .8rem;border-radius:10px}nav a.on{border:0;background:rgba(79,140,255,.14);color:var(--ac)}}

#auth{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 70% 0,rgba(124,92,255,.28),transparent),radial-gradient(800px 500px at 10% 100%,rgba(79,140,255,.25),transparent),#080d18;padding:1rem}
#auth .box{max-width:380px;width:100%;text-align:center;background:rgba(18,26,43,.7);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:2rem}
body{background:radial-gradient(900px 420px at 85% -10%,rgba(124,92,255,.18),transparent),radial-gradient(700px 400px at 0 100%,rgba(79,140,255,.12),transparent),var(--bg)}
.btn{background:linear-gradient(135deg,#4f8cff,#7c5cff);box-shadow:0 6px 18px rgba(79,140,255,.28)}.btn.s{background:var(--pn2);box-shadow:none}.btn.d{background:none;box-shadow:none}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border-radius:18px}
h1{background:linear-gradient(90deg,#fff,#a9c4ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:2rem}
.tag.ac{background:linear-gradient(135deg,#4f8cff,#7c5cff)}nav a.on{background:linear-gradient(135deg,rgba(79,140,255,.2),rgba(124,92,255,.2))}

.ph1{background-image:var(--i1)}.ph2{background-image:var(--i2)}.ph3{background-image:var(--i3)}.ph4{background-image:var(--i4)}
#auth{background:linear-gradient(rgba(6,12,28,.78),rgba(6,12,28,.94)),var(--i3) center/cover}
body{background:radial-gradient(900px 500px at 90% -10%,rgba(34,211,238,.10),transparent),radial-gradient(900px 500px at 0 0,rgba(79,140,255,.18),transparent),#070c1a}
#nv{position:fixed;top:0;left:0;right:0;bottom:auto;width:auto;height:auto;flex-direction:row;align-items:center;gap:.2rem;padding:0 .8rem;border:0;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(7,12,26,.88);backdrop-filter:blur(14px);overflow-x:auto;scrollbar-width:none;z-index:9}
#nv::-webkit-scrollbar{display:none}
#nv b{display:block;flex:none;font:900 1.05rem Inter,sans-serif;font-style:italic;letter-spacing:.06em;padding:0 1rem 0 .2rem;color:#fff;white-space:nowrap;text-transform:uppercase}#nv b em{color:var(--ac2);font-style:italic}
#nv a{flex:none;margin:0;padding:1rem .9rem;border-radius:0;font-size:.82rem;font-weight:800;font-style:italic;letter-spacing:.07em;text-transform:uppercase;text-align:center;color:#9fb0cf;box-shadow:none!important;border:0;background:none}
#nv a.on{color:#fff;background:none;box-shadow:inset 0 -3px 0 var(--ac2)!important;border:0}
#mn{margin:0 auto;padding:4.6rem 1rem 3rem;max-width:1100px}
h2{font-style:italic;font-weight:800}
.btn{border-radius:4px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding-left:1.3rem;padding-right:1.3rem;text-transform:uppercase;font-style:italic;font-weight:800;letter-spacing:.03em}.btn:focus-visible{filter:brightness(1.35)}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:340px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;padding:1.4rem;border:1px solid rgba(255,255,255,.1)}
.slides i{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;animation:fade 18s infinite}.slides i:nth-child(2){animation-delay:6s}.slides i:nth-child(3){animation-delay:12s}
@keyframes fade{0%{opacity:0}8%,33%{opacity:1}41%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.slides i{animation:none}.slides i:first-child{opacity:1}}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,12,28,.92),rgba(6,12,28,.3) 65%,rgba(6,12,28,.6)),linear-gradient(0deg,rgba(6,12,28,.85),transparent 55%)}
.hc,.pcard{position:relative;z-index:1}
.kick{letter-spacing:.2em;font-size:.72rem;color:var(--ac2);font-weight:700}
.hero h1{font-size:clamp(2rem,7vw,3.8rem);font-style:italic;font-weight:900;line-height:.95;text-transform:uppercase;margin:.3rem 0;-webkit-text-fill-color:#fff;background:none;color:#fff}
.hero p{margin:0;color:#c5d3ee;font-weight:600}
.pcard{width:150px;flex:none;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#2a4a9a,#0f1b3d);border:1px solid rgba(255,255,255,.28);box-shadow:0 12px 34px rgba(0,0,0,.55)}
.pimg{height:185px;background-size:cover;background-position:center 15%}.pn{padding:.5rem .6rem;display:flex;flex-direction:column}.pn b{font-size:.82rem;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}.pn span{font-size:.62rem;letter-spacing:.18em;color:var(--ac2);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin:.9rem 0}.tile:first-child{grid-column:span 2}
.tile{position:relative;overflow:hidden;border-radius:16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:.9rem;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.1)}
.tile i{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .4s}.tile i.ph1{background-position:center 12%}.tile:hover i{transform:scale(1.08)}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(5,10,24,.92))}.tile span,.tile small{position:relative;z-index:1}
.tile span{font:900 1.15rem Inter,sans-serif;font-style:italic;letter-spacing:.04em;text-transform:uppercase}.tile small{color:#b8c8e6;font-weight:600}.tile:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.hero+.mu{margin:.7rem 0 0!important}
@media(max-width:600px){.hero{min-height:300px;padding:1rem}.pcard{width:112px}.pimg{height:130px}.hero h1{font-size:2.1rem}}

import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=q=>document.querySelector(q),cfg=window.FIREBASE_CONFIG;
const show=(t,login)=>{document.querySelector('.app').style.display='none';$('#am').textContent=t;$('#auth').style.display='flex';$('#ab').style.display=login?'':'none';$('#ao').innerHTML=''};
const btn=(l,f,c)=>{const b=document.createElement('button');b.className='btn '+(c||'s');b.textContent=l;b.onclick=f;$('#ao').appendChild(b)};
if(/tu_correo/.test(String(window.OWNER_EMAIL))){show('Falta el correo del administrador: edita OWNER_EMAIL al inicio de index.html (ver LEEME.md).',false)}
else{
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),ADMIN=String(window.OWNER_EMAIL).toLowerCase();
let me='',uid='',ref=null,acc={coaches:[],players:[]},unsub=null;
window.FB={multi:false,access:()=>acc,user:()=>me,out:()=>signOut(auth),menu:()=>chooser(),
 save:raw=>ref&&setDoc(ref,{data:raw,updated:Date.now()},{merge:true}).catch(e=>alert('No se pudo guardar: '+e.message)),
 setAccess:(c,p)=>setDoc(ref,{coaches:c,players:p},{merge:true}).then(()=>{acc={coaches:c,players:p}})};
function openClub(r,role,x){if(unsub){unsub();unsub=null}ref=r;acc={coaches:x.coaches||[],players:x.players||[]};$('#auth').style.display='none';window.start(x.data,role);
 if(role=='player')unsub=onSnapshot(r,s=>{const v=s.data();if(v&&v.data)window.start(v.data,'player')})}
async function create(){const b={coaches:[me],players:[],data:null,owner:me,updated:Date.now()},r=doc(db,'club',uid);await setDoc(r,b);openClub(r,'coach',b)}
async function chooser(){show('Cargando tus accesos\u2026',false);
 try{
  const own=await getDoc(doc(db,'club',uid)),inv=await getDocs(query(collection(db,'club'),where('players','array-contains',me))),o=[];
  if(own.exists())o.push(['Mi club (entrenador)',()=>openClub(own.ref,'coach',own.data())]);
  inv.forEach(s=>{if(s.id!=uid)o.push(['Club de '+(s.data().owner||'un entrenador')+' (jugador)',()=>openClub(s.ref,'player',s.data())])});
  if(me==ADMIN){(await getDocs(collection(db,'club'))).forEach(s=>{if(s.id!=uid&&!o.some(z=>z[2]==s.id))o.push(['Admin: club de '+(s.data().owner||s.id),()=>openClub(s.ref,'coach',s.data()),s.id])})}
  window.FB.multi=o.length>1||(o.length>=1&&!own.exists());
  if(o.length==1&&me!=ADMIN)return o[0][1]();
  show(o.length?'Elige c\u00f3mo entrar:':'A\u00fan no tienes cuenta en la app. Si eres entrenador, crea la tuya. Si eres jugador, pide a tu entrenador que agregue este correo: '+me,false);
  o.forEach(z=>btn(z[0],z[1],'s'));
  if(!own.exists())btn('Crear mi cuenta de entrenador',create,'');
  btn('Salir',()=>signOut(auth),'s');
 }catch(e){show('Error de acceso: '+e.message+' (\u00bfpublicaste las reglas de Firestore?)',false);btn('Salir',()=>signOut(auth),'s')}}
$('#ab').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>show('No se pudo iniciar sesi\u00f3n: '+e.message,true));
onAuthStateChanged(auth,u=>{
 if(unsub){unsub();unsub=null}
 if(!u){me='';uid='';ref=null;show('Inicia sesi\u00f3n con tu cuenta de Google.',true);return}
 me=(u.email||'').toLowerCase();uid=u.uid;chooser()});
}
</script>
</body></html>
