<style>
:root{--bg:#0b1220;--pn:#121a2b;--pn2:#1c2740;--tx:#e8eefc;--mu:#8b9bb8;--ac:#4f8cff;--ok:#4ade80;--er:#fb7185;--ct:#14305a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:700;margin:0 0 .5rem;letter-spacing:.01em}
h1{font-size:2rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
.app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--pn);border-top:1px solid var(--pn2);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav a{flex:1;text-align:center;padding:.8rem 0;color:var(--mu);text-decoration:none;font-weight:600}
nav a.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
nav b{display:none}
main{flex:1;padding:1rem 1rem 6rem;max-width:980px;margin:0 auto;width:100%}
@media(min-width:800px){nav{top:0;bottom:auto;right:auto;width:190px;flex-direction:column;border:0;border-right:1px solid var(--pn2);padding-top:1.2rem}nav a{text-align:left;padding:.8rem 1.2rem;box-shadow:none!important}nav a.on{border-left:3px solid var(--ac)}nav b{display:block;font:700 1.5rem 'Barlow Condensed',sans-serif;padding:0 1.2rem 1rem;color:var(--ac)}main{margin-left:190px;padding-bottom:2rem}}
.card{background:var(--pn);border:1px solid var(--pn2);border-radius:10px;padding:1rem;margin-bottom:.8rem}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.btn{background:var(--ac);color:#1b1e23;border:0;border-radius:8px;padding:.6rem 1rem;font:600 .95rem Barlow,sans-serif;cursor:pointer}
.btn.s{background:var(--pn2);color:var(--tx)}.btn.d{background:none;color:var(--er);border:1px solid var(--er)}.btn.sm{padding:.35rem .6rem;font-size:.85rem}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--pn2);border-radius:8px;padding:.55rem;font:inherit}
label{display:block;font-size:.85rem;color:var(--mu);margin:.6rem 0 .2rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>.btn{flex:none}
.tag{display:inline-block;background:var(--pn2);border-radius:20px;padding:.1rem .6rem;font-size:.78rem;color:var(--mu);margin:0 .3rem .3rem 0}
.tag.ac{background:var(--ac);color:#1b1e23}.mu{color:var(--mu)}.er{color:var(--er)}.ok{color:var(--ok)}
.ct{width:100%;height:auto;display:block;border-radius:8px;background:var(--ct);touch-action:manipulation}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--pn2);margin:.4rem 0}
a.l{color:var(--ac);cursor:pointer;text-decoration:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5rem;background:var(--tx);color:#111;padding:.6rem 1rem;border-radius:8px;z-index:9}
.samp{border-left:3px solid var(--ac)}
#pr{display:none}
@media print{.app,.toast{display:none}#pr{display:block;background:#fff;color:#000;padding:0}#pr *{color:#000}#pr svg{max-width:360px}#pr .it{page-break-inside:avoid;border-top:1px solid #999;padding:.5rem 0}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--ac)}}
body{background:radial-gradient(900px 420px at 85% -10%,rgba(79,140,255,.14),transparent),var(--bg);font-family:Inter,system-ui,sans-serif}
.btn{font-family:Inter,system-ui,sans-serif}
h1,h2,h3,nav b{font-family:Inter,system-ui,sans-serif;letter-spacing:-.02em}
h1{font-size:1.75rem;font-weight:700;margin-bottom:.9rem}h2{font-size:.8rem;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}h3{font-size:1rem;font-weight:600}
.card{border-radius:16px;border:1px solid rgba(255,255,255,.06);padding:1.1rem}
.card:hover{border-color:rgba(79,140,255,.45)}
.btn{background:var(--ac);color:#fff;border-radius:10px}.btn.s{background:var(--pn2);color:var(--tx)}.btn.d{background:none;color:var(--er)}
.tag{background:rgba(79,140,255,.12);color:#9db8ee;border-radius:8px}.tag.ac{background:var(--ac);color:#fff}
nav{background:rgba(18,26,43,.92);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.06)}
input,select,textarea{border-radius:10px;background:#0e1626;border:1px solid rgba(255,255,255,.08)}
.ct{border-radius:12px;background:var(--ct)}.bar{height:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal b{text-align:center;color:var(--mu);font-size:.75rem}.day{background:var(--pn);border:1px solid rgba(255,255,255,.06);border-radius:10px;color:var(--tx);min-height:52px;padding:.3rem;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2rem}.day.today{border-color:var(--ac)}.day.sel{background:var(--pn2)}.day span{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}.day i{width:7px;height:7px;border-radius:50%;background:var(--ac)}.day i.m{background:#f59e0b}
@media(max-width:799px){nav a{font-size:.68rem;padding:.8rem 0}}
@media(min-width:800px){nav b{font-size:1.1rem;font-weight:700;letter-spacing:.08em}nav a{margin:0 .6rem;padding:.65rem .8rem;border-radius:10px}nav a.on{border:0;background:rgba(79,140,255,.14);color:var(--ac)}}

#auth{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 70% 0,rgba(124,92,255,.28),transparent),radial-gradient(800px 500px at 10% 100%,rgba(79,140,255,.25),transparent),#080d18;padding:1rem}
#auth .box{max-width:380px;width:100%;text-align:center;background:rgba(18,26,43,.7);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:2rem}
body{background:radial-gradient(900px 420px at 85% -10%,rgba(124,92,255,.18),transparent),radial-gradient(700px 400px at 0 100%,rgba(79,140,255,.12),transparent),var(--bg)}
.btn{background:linear-gradient(135deg,#4f8cff,#7c5cff);box-shadow:0 6px 18px rgba(79,140,255,.28)}.btn.s{background:var(--pn2);box-shadow:none}.btn.d{background:none;box-shadow:none}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border-radius:18px}

const uid=()=>Math.random().toString(36).slice(2,9);
const CATS=['Técnicos','Tácticos ofensivos','Tácticos defensivos','Transiciones','Físicos','Cognitivos','Porteros','Balón parado','Juegos reducidos'];
const GR={'Técnicos':'Técnico','Porteros':'Técnico','Tácticos ofensivos':'Táctico','Tácticos defensivos':'Táctico','Transiciones':'Táctico','Balón parado':'Táctico','Físicos':'Físico','Cognitivos':'Cognitivo','Juegos reducidos':'Integrado'};
const GC={'Técnico':'#4f8cff','Táctico':'#22d3ee','Físico':'#34d399','Cognitivo':'#a78bfa','Integrado':'#94a3b8'};
const LV=['Fácil','Medio','Difícil'],CAR=['Baja','Media','Alta'],ST=['Planificada','Realizada','Suspendida','Borrador','Plantilla'];
const KS=['n','c','s','o','a','l','p1','p2','m','mat','org','st','tp','er','fa','di','ca'];
const SEED=[
['Rondo 3 contra 1 con orientación corporal','Técnicos','Pase y recepción','Mejorar la recepción orientada y el pase al primer toque','Sub-10 a Sub-14','Fácil',4,6,8,'1 balón, 4 conos','Cuadrado de 5x5 m. Tres jugadores en las esquinas y uno al centro.','Los tres pasan el balón sin que el del centro lo toque.\nSi lo roba, cambia con quien perdió el balón.\nContar 10 pases seguidos como punto.','Recibir con el pie lejano al defensor. Mirar antes de recibir.','Control que frena el balón; pase sin mirar.','Espacio más grande o 2 toques libres.','Un toque obligatorio; espacio 4x4 m.','Media'],
['Circuito de pase y control orientado','Técnicos','Control orientado','Encadenar pase, control orientado y pase largo con ambas piernas','Sub-12 a Sub-16','Medio',6,10,12,'8 conos, 4 balones','Rectángulo de 10x15 m con 4 estaciones marcadas con conos.','Pase a la estación siguiente y ocupar su lugar.\nControl orientado hacia el cono libre y pase.\nA los 3 min se cambia la pierna de control.','Perfil abierto al recibir; golpear con la cara interna.','Controles muy largos; solo se usa la pierna fuerte.','Menos distancia entre estaciones.','Sumar un segundo balón.','Media'],
['Conservación 4 contra 2 con apoyos','Tácticos ofensivos','Conservación y circulación','Crear líneas de pase y ofrecer apoyos a distancia correcta','Sub-12 a Adulto','Medio',6,8,12,'Petos, conos','Cancha de 12x10 m. Cuatro atacantes en las esquinas, dos defensores al centro.','Los atacantes conservan el balón.\nQuien pierde el balón pasa a defender.\nPunto cada 8 pases consecutivos.','Apoyarse en ángulo, no en línea recta con el compañero.','Todos se quedan quietos mirando el balón.','Defensores pasivos.','Máximo 2 toques.','Alta'],
['Duelo de 1 contra 1 con finalización','Técnicos','Regate y situaciones de 1 contra 1','Ganar el duelo y finalizar con rapidez','Sub-12 a Adulto','Medio',6,12,12,'2 porterías, 1 portero, balones','Dos filas a 8 m de la portería. Atacante con balón, defensor desde el costado.','Al pitazo el atacante supera al defensor y remata.\nSi el defensor roba, finaliza en la portería pequeña.\nCambian de fila tras cada intento.','Cambio de ritmo tras el engaño; cuerpo entre balón y rival.','Regatear de espaldas a la portería.','Defensor al 50% de intensidad.','Tiempo límite de 5 segundos.','Alta'],
['Situación de 2 contra 1','Transiciones','Transiciones 2 contra 1, 3 contra 2','Decidir entre finalizar o pasar frente a un solo defensor','Sub-10 a Adulto','Fácil',5,9,10,'Portería, balones','Media cancha. Dos atacantes con balón y un defensor frente al portero.','Los atacantes avanzan en paralelo.\nEl defensor retrocede y cierra el pase.\nGol o pérdida; vuelve la siguiente tríada.','El portador atrae al defensor y pasa en el momento justo.','Pasar demasiado pronto o llegar en línea.','Defensor que solo puede ir un lado.','Defensor puede salir a presionar desde el medio.','Alta'],
['Transición 3 contra 2 y repliegue','Transiciones','Contraataques','Atacar rápido tras recuperar y replegar con orden','Sub-14 a Adulto','Medio',8,10,15,'2 porterías, petos','Cancha completa. Tres atacantes contra dos defensores; un tercer defensor se suma al repliegue.','Los tres atacan; tras el remate transiciona el otro equipo.\nEl equipo que pierde repliega a su zona.\nRotan roles cada 3 intentos.','Primer pase de ruptura; el más cercano presiona al balón.','Atacar sin ancho; defender de frente.','Un defensor extra desde el principio.','Limitar a 8 segundos.','Alta'],
['Ataque posicional 4 contra 4 con pívot','Tácticos ofensivos','Ataque posicional','Mover el balón y definir con el pívot','Sub-16 a Adulto','Difícil',8,10,20,'Petos, 2 porterías','Media cancha. Ataque de rombo contra defensa 2-2.','Salir desde el fondo con el rombo.\nUso del pívot de apoyo.\nSe marca tras 3 pases mínimo.','Rotar con movimientos de tercer hombre; ocupar el espacio libre.','Quedarse sin movimiento; pivot solo.','Defensa con un toque menos.','Ataque con 4 toques máximo.','Alta'],
['Presión tras pérdida','Transiciones','Reacción tras pérdida','Reaccionar en menos de 5 segundos tras perder el balón','Sub-14 a Adulto','Medio',8,10,12,'Petos, 2 porterías','Cancha completa 4 contra 4. Ante pérdida, el equipo presiona 5 segundos.','Juego libre en dos mitades.\nTras perder, el equipo presiona para recuperar.\nSi recupera en 5 s, gol vale doble.','Presión del más cercano y coberturas atrás.','Ir todos al balón; pausa al perder.','Presión solo hasta media cancha.','Reducir el tiempo a 3 segundos.','Alta'],
['Salida de presión ante defensa alta','Tácticos ofensivos','Ataque contra defensa organizada','Superar la presión alta con el portero-jugador','Sub-14 a Adulto','Difícil',9,10,15,'Petos, portería','Cancha completa. 4 + portero contra 4 en presión alta.','Portero saca con apoyo de dos jugadores.\nCruce de posiciones del pívot.\nPasar la línea de medio como objetivo.','Dar 2 opciones de pase; usar el portero como tercer hombre.','Tirar el balón sin opción.','Los rivales presionan al 50%.','Presión total.','Media'],
['Defensa de un saque de esquina','Tácticos defensivos','Defensa de balón parado','Organizar marca y bloqueo en el córner rival','Sub-14 a Adulto','Medio',5,8,10,'Portería, petos','Zona de córner con 2 atacantes y 2 defensores más portero.','Los atacantes presentan 2 variantes.\nLos defensores se reparten la marca.\nSe repite con cambios de roles.','Comunicación antes del saque; cada uno sabe su marca.','Salir tarde; no marcar al primer palo.','Una sola variante conocida.','Variante sorpresa.','Baja'],
['Saque de banda con dos alternativas','Balón parado','Saques de banda','Practicar un saque de banda con salida directa o con pared','Sub-12 a Adulto','Fácil',4,8,10,'Conos, balones','Banda con tres jugadores; uno saca.','Se decide la alternativa con una señal.\nEl receptor devuelve de pared.\nSe repite alternando lado.','Mirada al compañero antes de sacar.','Sacar sin señal acordada.','Defensor pasivo.','Defensor activo.','Baja'],
['Juego reducido con restricción de toques','Juegos reducidos','Juegos condicionados','Acelerar la toma de decisiones en espacio reducido','Sub-10 a Adulto','Medio',8,10,15,'Petos, 2 porterías','3 contra 3 en 20x15 m con porteros.','Dos toques máximo por jugador.\nGol de un toque vale doble.\nCambio de equipos cada 3 min.','Ofrecer apoyos antes de recibir.','Controlar con dos toques sin necesidad.','Toques libres.','Un toque, excepto el portero.','Alta'],
['Tarea de percepción y decisión con colores','Cognitivos','Velocidad de decisión','Mejorar escaneo y decisión según estímulo visual','Sub-8 a Sub-16','Fácil',6,12,10,'Conos de colores, balones','Cuadrado de 10x10 m con conos de colores. Un entrenador con tarjetas.','Se conduce el balón por el cuadrado.\nAl mostrar un color, se va al cono de ese color.\nSe cambia el estímulo cada 15 segundos.','Levantar la cabeza antes de conducir.','Mirar solo el balón.','Un solo color.','Dos estímulos juntos.','Media'],
['Blocajes y desvíos de portero','Porteros','Blocajes','Mejorar el blocaje de disparos y el desvío al corner','Sub-12 a Adulto','Medio',1,3,12,'Balones, portería','Portería con 2 lanzadores a 6 m.','Disparos rasantes y a media altura.\nBlocaje o desvío según la zona.\n3 series de 10 disparos.','Manos adelante; cuerpo detrás del balón.','Caer hacia atrás; manos separadas.','Disparos suaves.','Disparos con rebote.','Media'],
['Finalización después de una pared','Técnicos','Finalización','Rematar tras una pared con el compañero','Sub-12 a Adulto','Medio',4,8,10,'Portería, conos, balones','Dos filas a 10 m de la portería; un apoyo lateral.','Pase al apoyo y desmarque.\nPared y remate de primera.\nCambio de filas tras cada intento.','Pasar y moverse al espacio, no quedarse mirando.','Remate sin recibir de cara; pared lenta.','Apoyo sin presión.','Defensor pasivo detrás del atacante.','Media'],
['Conducción con cambios de dirección','Técnicos','Conducción y dominio del balón','Dominar el balón en cambios de ritmo y dirección','Sub-8 a Sub-12','Fácil',4,12,10,'12 conos, balones','Zona de 15x10 m con conos dispersos; un balón por jugador.','Conducir sin chocar con compañeros.\nA la señal, cambio de dirección y de pierna.\nCompetir por tocar más conos.','Balón cerca del pie; cabeza arriba.','Mirar solo el balón.','Menos conos.','Solo la pierna débil.','Media'],
['Protección del balón en 1 contra 1','Técnicos','Protección del balón','Proteger el balón con el cuerpo ante presión','Sub-10 a Sub-16','Medio',6,12,8,'Conos, petos','Cuadrado de 5x5 m; un atacante y un defensor por zona.','El atacante protege 20 segundos.\nSi el defensor roba, cambian roles.\nSe cuentan los robos.','Cuerpo entre balón y rival, brazo como barrera sin empujar.','Dar la espalda sin mirar.','Defensor al 50%.','Defensor al 100%.','Media'],
['Juego condicionado para trabajar amplitud','Tácticos ofensivos','Amplitud y profundidad','Usar los carriles laterales para abrir al rival','Sub-14 a Adulto','Medio',8,10,15,'Petos, 2 porterías','4 contra 4 con carriles laterales marcados.','Cada equipo debe tocar un carril lateral antes de rematar.\nGol sin pasar por el carril no vale.\nCambio de equipos cada 3 min.','Ocupar ancho y profundidad antes de progresar.','Juntarse todos en el centro.','Un solo toque en el carril.','Carril solo para el pívot.','Alta'],
['Superioridad ofensiva con portero','Tácticos ofensivos','Superioridades numéricas','Decidir y finalizar en superioridad numérica','Sub-12 a Adulto','Medio',7,10,12,'Portería, petos','Media cancha: 3 atacantes contra 2 defensores y portero.','Atacan 20 segundos máximo.\nSi recuperan, salen al contrataque a otra portería.\nRotan roles.','Fijar al defensor y pasar al libre.','Atacar en línea; remate forzado.','Defensor 2 sin presión.','Tiempo límite de 10 s.','Alta'],
['Rotaciones en rombo','Tácticos ofensivos','Rotaciones ofensivas','Ejecutar rotaciones ofensivas fluidas en rombo','Sub-16 a Adulto','Difícil',5,6,15,'Conos, balones','Cancha con 4 jugadores en rombo y portería rival.','Pase y rotación cruzada.\nEl pívot descarga y gira.\nFinalizar tras 4 pases.','Moverse después de pasar; ocupar el espacio liberado.','Rotar sin sentido; pivot fijo.','Sin defensor.','Con un defensor.','Media'],
['Defensa zonal 2-2 con basculación','Tácticos defensivos','Defensa zonal','Mover el bloque defensivo según el balón','Sub-14 a Adulto','Medio',8,10,15,'Petos, portería','Dos líneas de dos defensores frente a 4 atacantes.','Basculación hacia el lado del balón.\nCierre del pase interior.\nCambio de roles cada 3 min.','Distancias cortas entre compañeros; comunicar.','Separar las líneas.','Atacantes con 3 toques.','Atacantes sin límite.','Media'],
['Repliegue y protección del centro','Tácticos defensivos','Cierres de línea de pase','Replegar y cerrar el pasillo central','Sub-14 a Adulto','Medio',8,10,12,'Petos, 2 porterías','Cancha completa: ataque rápido contra dos defensores que replegan.','Un equipo ataca; el otro repliega al área.\nProteger el centro y orientar afuera.\nGol cuenta doble.','Repliegue por dentro; el más cercano frena.','Replegar por afuera dejando el centro libre.','Menos atacantes.','Más atacantes.','Alta'],
['Presión media en cuadrante','Tácticos defensivos','Presión alta, media y baja','Presionar de forma coordinada en media cancha','Sub-14 a Adulto','Medio',8,10,15,'Petos, conos','Media cancha 4 contra 4 con zona de presión marcada.','Presionar al entrar en la zona.\nEl más cercano ataca; los demás cubren.\nSe puntúa por robos.','Anticipar el pase; no ir todos.','Presión individual aislada.','Zona más grande.','Zona más pequeña.','Alta'],
['Defensa del pívot','Tácticos defensivos','Defensa del pívot','Defender al pívot con orientación y cobertura','Sub-14 a Adulto','Difícil',5,6,12,'Petos, portería','Un pívot con balón de espaldas, un defensor y un cobertor.','El defensor se coloca al costado.\nEl cobertor cierra el giro.\nRotan roles.','Contacto controlado, anticipar el giro.','Dejar girar al pívot.','Pívot sin presión.','Pívot con compañero de apoyo.','Media'],
['Ataque tras recuperación 2 contra 2 con comodín','Transiciones','Ataque tras recuperación','Atacar rápido tras recuperar el balón','Sub-12 a Adulto','Medio',5,6,12,'Petos, 2 porterías','2 contra 2 con un comodín que apoya al equipo con balón.','Juego libre; al recuperar se activa el comodín.\nAtacar en menos de 8 segundos.\nGol vale doble.','Primer pase rápido; atacar el espacio.','Conservar demasiado.','Comodín fijo.','Sin comodín.','Alta'],
['Transición tras remate y rebote','Transiciones','Transición después de un remate o rebote','Reaccionar al rebote o a la pérdida tras rematar','Sub-14 a Adulto','Medio',8,10,12,'2 porterías, balones','3 contra 3 con segundo balón junto a la portería.','Tras el remate se juega el rebote.\nSi pierden, repliegan.\nSe rota cada 2 minutos.','Seguir la jugada; tapar al más cercano.','Mirar el remate sin moverse.','Rebote solo para atacantes.','Rebote libre.','Alta'],
